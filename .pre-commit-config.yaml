# Local hooks run through the frozen uv environment, so every developer and CI
# checks the same locked tool versions. Integration tests require PostgreSQL and
# RabbitMQ and deliberately live in CI, not in the commit hook.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy (payment_resolver + migrations)
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      - id: unit-tests
        name: deterministic unit tests
        entry: uv run --frozen pytest tests/unit -q
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
