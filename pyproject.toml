[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payment-resolver"
version = "0.1.0"
description = "Durable asynchronous payment processing"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2,<3", "pydantic-settings>=2,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.30,<1",
  "faststream[rabbit]==0.7.7", "httpx==0.28.1", "alembic>=1.14,<2",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "asyncpg-stubs>=0.32,<0.33",
  "mypy>=2.4,<3",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.17,<0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["payment_resolver"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is enforced by `ruff format --check`; linting it too would
# duplicate the formatter and disagree about long strings and comments.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["payment_resolver"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# Production code only. Tests are exercised by pytest, not type checked.
files = ["payment_resolver", "migrations"]
strict = true
show_error_codes = true
show_column_numbers = true
pretty = true
